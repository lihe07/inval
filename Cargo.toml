[package]
name = "inval"
version = "0.1.0"
edition = "2024"
description = "Cache a function's result in memory and Redis, invalidated in every process on change."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lihe07/inval"
readme = "README.md"
keywords = ["cache", "redis", "invalidation", "pubsub"]
categories = ["caching", "asynchronous"]
exclude = ["python/"]

[workspace]
members = ["macros"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
inval-macros = { path = "macros", version = "0.1.0" }
papaya = "0.2.5"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager", "script"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
