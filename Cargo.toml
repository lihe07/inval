[package]
name = "inval"
version = "0.2.0"
edition = "2024"
description = "Cache a function's result in memory and Redis, invalidated in every process on change."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lihe07/inval"
readme = "README.md"
keywords = ["cache", "redis", "invalidation", "pubsub"]
categories = ["caching", "asynchronous"]
exclude = ["python/"]

[workspace]
members = ["macros"]

[dependencies]
futures-util = { version = "0.3", default-features = false }
inval-macros = { path = "macros", version = "0.2.0" }
papaya = "0.2"
redis = { version = "1.7", features = ["tokio-comp", "connection-manager", "script"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
