name: Release

on:
  push:
    tags: ["v*"]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in Cargo.toml macros/Cargo.toml python/pyproject.toml; do
            version=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
            echo "$file: $version"
            if [ "$version" != "$tag" ]; then
              echo "::error file=$file::version $version does not match tag v$tag"
              exit 1
            fi
          done

  test:
    needs: versions
    uses: ./.github/workflows/ci.yml

  crates:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish, skipping versions already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in inval-macros inval; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'inval-release (github.com/lihe07/inval)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published"
            else
              cargo publish -p "$crate"
            fi
          done

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
